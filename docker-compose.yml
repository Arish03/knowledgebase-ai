services:
  # -----------------------------------------------------------------------
  # FastAPI backend — exposes /ask, /health, /reindex on port 4040
  # -----------------------------------------------------------------------
  api:
    build: .
    network_mode: "host"
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 4040
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./company_docs:/app/company_docs
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Streamlit chat UI — exposes UI on port 8501
  # -----------------------------------------------------------------------
  ui:
    build: .
    network_mode: "host"
    command: streamlit run app/ui/chat.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - API_BASE_URL=http://localhost:4040
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped
